<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sotty — Do'kon ochish</title>
<style>
  :root { --p:#2563eb; --bg:#f4f6fa; --line:#e5e9f0; --muted:#64748b; --rose:#e11d48; --green:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#0f172a; }
  .wrap { max-width:460px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; text-align:center; margin:0 0 4px; }
  .sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; }
  .btn { width:100%; margin-top:18px; border:0; border-radius:10px; padding:12px; background:var(--p); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .err { color:var(--rose); font-size:13px; margin-top:10px; }
  .help { color:var(--muted); font-size:12px; margin-top:3px; }
  .ok { text-align:center; }
  .ok .big { font-size:48px; }
  a.link { display:block; margin-top:10px; padding:11px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--p); font-weight:600; text-align:center; }
  code { background:#eef2f7; padding:1px 6px; border-radius:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛍 O'z do'koningizni oching</h1>
  <div class="sub">Ma'lumotlaringizni kiriting — bot 2 daqiqada tayyor bo'ladi</div>
  <div id="root"></div>
</div>
<script>
const root = document.getElementById("root");
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function form() {
  root.innerHTML = `<form class="card" id="f">
    <label>Do'kon nomi *</label><input id="name" placeholder="Masalan: Qo'qon Market" required />
    <label>Egasi (ism)</label><input id="ownerName" />
    <label>Telefon raqami * (admin panelga login)</label><input id="ownerPhone" placeholder="+998 90 123 45 67" required />
    <div class="help">Shu raqam — admin panelga kirish loginingiz. Parolni unutsangiz, tiklash kodi shu raqamga (bot orqali) yuboriladi.</div>
    <label>Telegram bot tokeni *</label><input id="botToken" placeholder="7712...:AAE..." required />
    <div class="help">@BotFather → /newbot → tokenni shu yerga qo'ying</div>
    <label>Admin panel paroli *</label><input id="adminPassword" type="password" placeholder="kamida 6 belgi" required />
    <label>Tarif</label><select id="tariff"><option value="free">Bepul</option><option value="basic">Basic</option><option value="pro">Pro</option></select>
    <div class="err" id="err" style="display:none"></div>
    <button class="btn" type="submit" id="go">Do'konni yaratish</button>
  </form>`;
  document.getElementById("f").onsubmit = submit;
}
async function submit(e) {
  e.preventDefault();
  const g = (id) => document.getElementById(id).value.trim();
  const go = document.getElementById("go"); const err = document.getElementById("err");
  err.style.display = "none"; go.disabled = true; go.textContent = "Yaratilmoqda…";
  try {
    const r = await fetch("/api/register", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
      name:g("name"), ownerName:g("ownerName"), ownerPhone:g("ownerPhone"), botToken:g("botToken"), adminPassword:g("adminPassword"), tariff:g("tariff"),
    })});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Xatolik");
    success(j);
  } catch (x) { err.textContent = x.message; err.style.display = "block"; go.disabled = false; go.textContent = "Do'konni yaratish"; }
}
function success(j) {
  root.innerHTML = `<div class="card ok">
    <div class="big">✅</div>
    <h1 style="font-size:19px">Do'koningiz tayyor!</h1>
    <div class="sub">Botingiz: <code>@${esc(j.botUsername||"")}</code> — endi ishlayapti</div>
    <a class="link" href="${esc(j.adminUrl)}">🖥 Admin panelga kirish</a>
    <a class="link" href="${esc(j.appUrl)}">📱 Mini App (do'kon)</a>
    <div class="help" style="margin-top:14px"><b>Muhim:</b> admin panelga <b>telefon raqami + parol</b> bilan kirasiz. Parolni tiklash ishlashi uchun botingizni Telegramda oching → <b>/start</b> bosing → <b>telefon raqamingizni ulashing</b> (kontakt tugmasi). Shunda unutilgan parol kodi shu raqamga keladi.</div>
  </div>`;
}
form();
</script>
</body>
</html>
